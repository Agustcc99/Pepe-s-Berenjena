<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121F14; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #unity-frame { position: fixed; left: 0; top: 0; width: 450px; height: 800px; }
      #unity-canvas { position: absolute; width: 100%; height: 100%; background: #121F14; touch-action: none; outline: none; }
      #unity-loading { position: absolute; left: 0; right: 0; top: 50%; display: none; }
      #unity-progress-empty { width: 50%; height: 10px; margin: 0 auto; background: #2d4a31; border-radius: 5px; overflow: hidden; }
      #unity-progress-full { width: 0%; height: 100%; background: #e5b93c; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-frame">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading">
        <div id="unity-progress-empty"><div id="unity-progress-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var frame = document.querySelector("#unity-frame");

      // Marco 9:16 centrado a todo el alto de la ventana; si la pantalla es mas angosta, llena el ancho.
      // Se calcula en pixeles (nunca 0) antes de crear el juego y en cada cambio de tamano.
      function layoutFrame() {
        var h = Math.max(window.innerHeight, 200);
        var w = Math.max(Math.min(window.innerWidth, Math.floor(h * 9 / 16)), 112);
        frame.style.width = w + "px";
        frame.style.height = h + "px";
        frame.style.left = Math.max(0, Math.floor((window.innerWidth - w) / 2)) + "px";
      }
      layoutFrame();
      canvas.width = frame.clientWidth;
      canvas.height = frame.clientHeight;
      window.addEventListener("resize", layoutFrame);

      // Teclado (PC): el canvas toma el foco al cargar y con cada clic, y las teclas del juego no scrollean la pagina
      // (flechas, espacio) ni se las come el navegador (Esc sale de pantalla completa por su cuenta; no se toca).
      canvas.focus();
      window.addEventListener("pointerdown", function() { canvas.focus(); });
      window.addEventListener("keydown", function(e) {
        if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
        }
      });

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Calor en celulares (iPhone con DPR 3 renderizaba ~1170x2532 px a 60 FPS): se limita la resolucion del canvas y la tasa de cuadros.
      // Por defecto: en pantallas tactiles DPR <= 2 y 30 FPS; en PC DPR <= 2 y 60 FPS. Para probar sin recompilar: ?dpr=1.5&fps=45 en la URL.
      var params = new URLSearchParams(window.location.search);
      var isTouch = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var dprParam = parseFloat(params.get("dpr"));
      var fpsParam = parseFloat(params.get("fps"));
      var renderDpr = Math.max(0.5, Math.min(window.devicePixelRatio || 1, dprParam > 0 ? dprParam : 2));
      var fpsCap = fpsParam > 0 ? fpsParam : (isTouch ? 30 : 60);

      // Tope de FPS: Unity (emscripten) pide cada cuadro con requestAnimationFrame; se saltean los cuadros que sobran
      // (sin timers: se mantiene la sincronia con la pantalla). Con 60 o mas no se toca nada.
      if (fpsCap < 58) {
        var nativeRaf = window.requestAnimationFrame.bind(window);
        var minGap = 1000 / fpsCap - 4;
        var lastFrame = 0;
        window.requestAnimationFrame = function(callback) {
          return nativeRaf(function tick(time) {
            if (time - lastFrame < minGap) { nativeRaf(tick); return; }
            lastFrame = time;
            callback(time);
          });
        };
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-frame",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
        devicePixelRatio: renderDpr,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        var loading = document.querySelector("#unity-loading");
        var bar = document.querySelector("#unity-progress-full");

        // Con un portal (CrazyGames) se espera, hasta 3 s, a que su SDK termine de iniciar: así la primera lectura de la partida ya
        // encuentra el módulo Data (la nube de un jugador logueado). Sin portal arranca de inmediato.
        var portal = window.FarmIdlePortal;
        var portalReady = portal && typeof portal.whenReady === 'function'
          ? Promise.race([portal.whenReady(), new Promise(function(resolve) { setTimeout(resolve, 3000); })])
          : Promise.resolve();

        portalReady.then(function() {
          return createUnityInstance(canvas, config, function(progress) {
            if (progress < 1) {
              loading.style.display = "block";
              bar.style.width = 100 * progress + "%";
            } else {
              loading.style.display = "none";
            }
          });
        }).catch(function(message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
